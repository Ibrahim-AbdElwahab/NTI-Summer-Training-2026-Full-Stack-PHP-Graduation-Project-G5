<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Comments & Likes</title>

    <link rel="stylesheet" href="comments.css">
</head>

<body>


<div class="container">


    <!-- Profile Section -->
    <div class="profile">

        <img 
        src="user.png" 
        id="profileImage"
        alt="Profile Image">


        <h2 id="profileName">
            Omar
        </h2>


        <p id="bio">
            Computer Science Student
        </p>


        <div class="stats">


            <div>
                <h3 id="commentCount">
                    0
                </h3>
                <span>
                    Comments
                </span>
            </div>



            <div>
                <h3 id="likeCount">
                    0
                </h3>

                <span>
                    Likes
                </span>

            </div>


        </div>


    </div>



    <hr>



    <h2>Comments System</h2>


    <!-- اسم المستخدم -->
    <input
        type="text"
        id="username"
        placeholder="Your Name">



    <!-- كتابة التعليق -->
    <textarea
        id="comment"
        placeholder="Write your comment">
    </textarea>



    <!-- زر إضافة تعليق -->
    <button onclick="addComment()">
        Add Comment
    </button>



    <hr>



    <!-- مكان عرض التعليقات -->
    <div id="comments"></div>


</div>



<script src="comments.js"></script>

</body>

</html>
